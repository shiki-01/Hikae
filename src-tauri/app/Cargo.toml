[package]
name = "hikae"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "hikae"

[lib]
name = "hikae_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
serde = { workspace = true }
time = "0.3"
core-git = { workspace = true }
core-safety = { workspace = true }
core-ops = { workspace = true }
core-watch = { workspace = true }
core-github = { workspace = true }
core-preview = { workspace = true }
core-llm = { workspace = true }
core-store = { workspace = true, features = ["specta"] }

[[bin]]
name = "hikae"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"

[lints]
workspace = true
