[package]
name = "hikae"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "hikae"

[lib]
name = "hikae_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
# 二重起動を防ぎ、既存のウィンドウを前面に出す（設計書 8.3）。バージョンは固定する
tauri-plugin-single-instance = "=2.4.5"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
serde = { workspace = true }
time = "0.3"
core-git = { workspace = true }
core-safety = { workspace = true }
core-ops = { workspace = true }
core-watch = { workspace = true }
core-github = { workspace = true }
core-preview = { workspace = true }
core-llm = { workspace = true }
core-store = { workspace = true, features = ["specta"] }
# 新規ファイルの「元に戻す（作成しない）」でごみ箱へ移す。バージョンは固定する
trash = "=5.2.9"
# app-blob のパス（URL エンコードされた相対パス）を戻す。Cargo.lock に既にある版を使う
percent-encoding = "2"
# AI の導入可否の判定に使う、総メモリと空き容量（設計書 10.5）。機能は system と disk だけに絞る。バージョンは固定する
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "disk"] }
# ローカル LLM の生成の時間制限（tokio::time）と、モデルのダウンロードの中断（CancellationToken）。core-llm と同じ版
tokio = { version = "1", features = ["time", "sync"] }
tokio-util = "0.7"

[[bin]]
name = "hikae"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"

[lints]
workspace = true
