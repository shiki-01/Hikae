[package]
name = "core-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["time", "sync"] }
tokio-util = { version = "0.7" }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[dev-dependencies]
httpmock = "0.8"
tokio-test = "0.4"

[lints]
workspace = true

# Android だけ: OS の証明書検証（JNI の初期化が要る）を避け、同梱のルート証明書で検証する（http.rs）。
# rustls は reqwest が使う版（0.23）に合わせる
[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
webpki-roots = "1"
