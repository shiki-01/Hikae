[package]
name = "hikae-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "hikae-mobile"

[lib]
name = "hikae_mobile_lib"
# モバイル（iOS は staticlib、Android は cdylib）とデスクトップ上の確認（rlib）の両方で使う
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# ログインの確認ページを開く（Rust 側のみ。画面には権限を与えない）。app と同じ版
tauri-plugin-opener = "=2.7.0"
# Android のトークン保管（Android Keystore。設計書 14.6）
tauri-plugin-hikae-secure-store = { path = "../plugins/secure-store" }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
serde = { workspace = true }
core-github = { workspace = true }
core-remote = { workspace = true }
base64 = "0.22"

[[bin]]
name = "hikae-mobile"
path = "src/main.rs"

[[bin]]
name = "export-bindings-mobile"
path = "src/bin/export-bindings-mobile.rs"

[lints]
workspace = true
