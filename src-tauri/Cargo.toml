[workspace]
members = [
	"app",
	"crates/core-git",
	"crates/core-safety",
	"crates/core-ops",
	"crates/core-watch",
	"crates/core-github",
	"crates/core-preview",
	"crates/core-llm",
	"crates/core-store",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# ワークスペース内 crate
core-git = { path = "crates/core-git" }
core-safety = { path = "crates/core-safety" }
core-ops = { path = "crates/core-ops" }
core-watch = { path = "crates/core-watch" }
core-github = { path = "crates/core-github" }
core-preview = { path = "crates/core-preview" }
core-llm = { path = "crates/core-llm" }
core-store = { path = "crates/core-store" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[workspace.lints.clippy]
unwrap_used = "deny"
