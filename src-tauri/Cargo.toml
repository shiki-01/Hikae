[workspace]
members = [
	"app",
	"mobile",
	"plugins/secure-store",
	"crates/core-git",
	"crates/core-safety",
	"crates/core-ops",
	"crates/core-watch",
	"crates/core-github",
	"crates/core-remote",
	"crates/core-preview",
	"crates/core-llm",
	"crates/core-store",
	"extensions/office-extractor",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# ワークスペース内 crate
core-git = { path = "crates/core-git" }
core-safety = { path = "crates/core-safety" }
core-ops = { path = "crates/core-ops" }
core-watch = { path = "crates/core-watch" }
core-github = { path = "crates/core-github" }
core-remote = { path = "crates/core-remote" }
core-preview = { path = "crates/core-preview" }
core-llm = { path = "crates/core-llm" }
core-store = { path = "crates/core-store" }

# 拡張（WASM 抽出器）は起動時に cranelift でコンパイルする（設計書 11.1）。debug の最適化なしだと数十秒かかるため、
# コンパイラの crate だけ最適化する（依存の初回ビルドは長くなるが、起動は速くなる。release の設定には影響しない）
[profile.dev.package.cranelift-codegen]
opt-level = 2

[profile.dev.package.cranelift-frontend]
opt-level = 2

[profile.dev.package.cranelift-entity]
opt-level = 2

[profile.dev.package.cranelift-bitset]
opt-level = 2

[profile.dev.package.cranelift-bforest]
opt-level = 2

[profile.dev.package.cranelift-control]
opt-level = 2

[profile.dev.package.cranelift-native]
opt-level = 2

[profile.dev.package.regalloc2]
opt-level = 2

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2

# 開発時の再ビルドを軽くする。行番号だけの debug 情報にして、変数の詳細は持たない（スタックトレースの行は残る）。
# 依存の crate は debug 情報を作らない（依存の再コンパイルと pdb の書き出しを減らす）
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[workspace.lints.clippy]
unwrap_used = "deny"
