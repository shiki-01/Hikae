name: Mobile

# モバイル版（hikae-mobile。設計書 14 章）のビルド。
# - Android: デバッグ署名の APK を artifact に出す（端末に直接入れて試せる）
# - iOS: 署名用のシークレットがあれば署名して ipa を作り、TestFlight へアップロードする。
#   シークレットが無いとき（fork の PR など）は、iOS 向けの Rust のコンパイル確認だけを行う
# 必要なシークレットと手順は docs/notes/mobile-testflight.md

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - '.github/workflows/mobile.yml'
      - 'src-tauri/mobile/**'
      - 'src-tauri/plugins/**'
      - 'src-tauri/crates/core-remote/**'
      - 'src-tauri/crates/core-github/**'
      - 'src-tauri/crates/core-preview/**'
      - 'src-tauri/Cargo.lock'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - '.github/workflows/mobile.yml'
      - 'src-tauri/mobile/**'
      - 'src-tauri/plugins/**'
  workflow_dispatch:
    inputs:
      testflight:
        description: 'iOS を TestFlight へアップロードする（署名のシークレットが必要）'
        type: boolean
        default: true

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Android SDK / NDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        working-directory: src-tauri
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Android プロジェクトの生成
        run: pnpm tauri:mobile android init --ci

      # versionCode は実行番号（Google Play に出すときに増え続ける必要がある）
      - name: Build APK (debug, arm64)
        run: >
          pnpm tauri:mobile android build --debug --apk --target aarch64 --ci
          --config '{"bundle":{"android":{"versionCode":${{ github.run_number }}}}}'

      - uses: actions/upload-artifact@v4
        with:
          name: hikae-android-debug-apk
          path: src-tauri/mobile/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # シークレットは if に直接書けないため、有無を環境変数にして判定する
      HAS_IOS_SIGNING: ${{ secrets.IOS_CERTIFICATE != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_MOBILE_PROVISION != '' && secrets.APPLE_DEVELOPMENT_TEAM != '' }}
      HAS_APPSTORE_KEY: ${{ secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        working-directory: src-tauri
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 署名なしでも、iOS 向けに Rust がコンパイルできることは確かめる
      - name: Compile check (aarch64-apple-ios)
        working-directory: src-tauri
        run: cargo build -p hikae-mobile --lib --target aarch64-apple-ios

      - name: Install XcodeGen
        if: env.HAS_IOS_SIGNING == 'true'
        run: brew install xcodegen

      - name: iOS プロジェクトの生成
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: pnpm tauri:mobile ios init --ci

      # ビルド番号（CFBundleVersion）は実行番号。TestFlight は同じ版の中でビルド番号が増え続ける必要がある。
      # 証明書とプロビジョニングプロファイルは tauri CLI が取り込む
      - name: Build ipa (app-store-connect)
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: >
          pnpm tauri:mobile ios build --export-method app-store-connect --ci
          --config '{"bundle":{"iOS":{"bundleVersion":"${{ github.run_number }}"}}}'

      - name: Find ipa
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          IPA=$(find src-tauri/mobile/gen/apple -name '*.ipa' | head -n 1)
          test -n "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: env.HAS_IOS_SIGNING == 'true'
        with:
          name: hikae-ios-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      # push（main）と、手動実行で testflight が真のときだけ TestFlight へ送る
      - name: Upload to TestFlight
        if: >
          env.HAS_IOS_SIGNING == 'true' && env.HAS_APPSTORE_KEY == 'true' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_dispatch' && inputs.testflight))
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
